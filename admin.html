<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIRUNE | 店長發卡後台</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #e2d5c5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: #fff; padding: 50px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border: 2px dashed #8D6E63; }
        .auth-code { font-size: 4rem; color: #d4af37; letter-spacing: 8px; margin: 25px 0; font-weight: bold; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        button { background: #5d4037; color: #fff; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: #d4af37; color: #5d4037; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status-msg { margin-top: 20px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2 style="color: #5d4037; margin-top: 0;">🐾 DIRUNE 賓果發卡機 🐾</h2>
        <p style="color: #888;">請點擊按鈕，系統將自動生成授權碼並同步至 Google 試算表</p>
        
        <div id="code-display" class="auth-code">----</div>
        
        <button id="generate-btn">生成授權碼</button>
        <p id="status-msg" class="status-msg"></p>
    </div>

    <script>
        // 你的 Google Apps Script 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwcdurE_boWIgiZ4ZmI_xumwf7UL813_W-3PnOmsdj3aE96-t6ec0q9hTEoJOFDMwl6/exec";
        const btn = document.getElementById('generate-btn');
        const display = document.getElementById('code-display');
        const status = document.getElementById('status-msg');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.innerText = "資料同步中...";
            status.innerHTML = "正在與 Google 雲端連線 ☁️...";
            display.innerText = "----";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "generate" })
                });
                const data = await response.json();
                
                if (data.success) {
                    display.innerText = data.authCode;
                    status.innerHTML = `✅ 生成成功！客人專屬防偽碼為: <strong>${data.ticketId}</strong><br>資料已成功寫入 Google 試算表。`;
                } else {
                    status.innerText = "❌ 發生錯誤，請重試。";
                }
            } catch (err) {
                status.innerText = "❌ 連線失敗: " + err;
            }
            
            btn.disabled = false;
            btn.innerText = "生成下一組授權碼";
        });
    </script>
</body>
</html>
