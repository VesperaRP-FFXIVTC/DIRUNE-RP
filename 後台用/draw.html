<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>DIRUNE | 店長開獎廣播台</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #e2d5c5; text-align: center; padding: 50px; }
        .box { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border: 2px dashed #8D6E63; }
        input { font-size: 2rem; padding: 10px; width: 100px; text-align: center; border: 2px solid #d4af37; border-radius: 10px; margin-bottom: 20px; }
        button { background: #5d4037; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; transition: 0.3s; margin: 5px; }
        button:hover { background: #d4af37; color: #5d4037; }
        .reset-btn { background: #d32f2f; }
        .reset-btn:hover { background: #b71c1c; color: white; }
        #drawn-list { margin-top: 20px; font-size: 1.2rem; color: #d4af37; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #5d4037;">📢 實時開獎廣播台</h2>
        <p>在遊戲裡抽球後，輸入號碼並按下「廣播」，所有客人的網頁就會同步顯示！</p>
        <input type="number" id="num-input" placeholder="00" min="1" max="50">
        <br>
        <button id="send-btn">廣播號碼 📡</button>
        <button id="reset-btn" class="reset-btn">清空上一局紀錄</button>
        <div id="status" style="margin-top: 15px; color: #666;"></div>
        <h3 style="margin-top:30px;">已開出號碼：</h3>
        <div id="drawn-list">無</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwcdurE_boWIgiZ4ZmI_xumwf7UL813_W-3PnOmsdj3aE96-t6ec0q9hTEoJOFDMwl6/exec";
        const input = document.getElementById('num-input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        const listDiv = document.getElementById('drawn-list');
        const status = document.getElementById('status');

        async function fetchDraws() {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_draws' }) });
            const data = await res.json();
            if(data.drawn && data.drawn.length > 0) {
                listDiv.innerText = data.drawn.join(' , ');
            } else {
                listDiv.innerText = '目前無開出號碼';
            }
        }

        sendBtn.addEventListener('click', async () => {
            const num = input.value.trim();
            if(!num || num < 1 || num > 50) return alert('請輸入 1~50 的數字！');
            sendBtn.disabled = true;
            status.innerText = "傳送中...";
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'add_draw', number: num }) });
            status.innerText = "✅ 廣播成功！";
            input.value = '';
            input.focus();
            fetchDraws();
            sendBtn.disabled = false;
        });

        resetBtn.addEventListener('click', async () => {
            if(confirm("確定要清空開獎紀錄嗎？(新的一局開始前務必清空)")) {
                status.innerText = "清空中...";
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'reset_draws' }) });
                status.innerText = "✅ 已清空";
                fetchDraws();
            }
        });

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendBtn.click(); });
        fetchDraws(); // 網頁打開時先抓一次
    </script>
</body>
</html>
